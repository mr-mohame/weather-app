<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Weather App</title>
</head>

<body class="m-0 p-0 box-border min-h-screen flex flex-col bg-slate-100 text-slate-800">

    <header class="bg-gradient-to-br from-sky-400 to-blue-600 p-4 text-center text-white">
        <h1 class="text-2xl font-bold tracking-widest">Weather App</h1>
        <p class="mt-1 text-sm">Consultez la meteo de votre ville</p>
    </header>

    <main class="mx-auto flex w-full max-w-2xl flex-1 flex-col items-center justify-center gap-6 px-4 py-8">
        <section class="w-full max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-md">
            <h2 class="mx-6 text-lg font-semibold">Rechercher une ville</h2>

            <form id="form-search" class="flex gap-2 w-full bg-white p-6 ">
                <input type="text" id="input-ville" placeholder="Exemple: Taza, Fes, Casablanca, ..."
                    class="w-full rounded-lg border border-slate-300 p-3 outline-none focus:border-blue-500">
                <button type="submit" id="btn-search"
                    class="rounded-lg bg-blue-600 px-5 py-3 font-medium text-white hover:bg-blue-700 cursor-pointer" type="submit">
                    Rechercher
                </button>
            </form>

            <!-- partie loading... -->
            <p id="msg-loading" class="mt-3 hidden text-center text-blue-600">Chargemenet...</p>
            <!-- msg erreur -->
            <p id="msg-erreur" class="mt-3 hidden text-center text-red-500"></p>
            <button id="btn-reessayer" type="button" class="hidden block mx-auto rounded-lg bg-blue-600 px-5 py-3 font-medium text-white hover:bg-blue-700 cursor-pointer">
                Reessayer
            </button>


        </section>
        <!-- carte  meteo-->
        <section id="carte-meteo" class="hidden w-full">

            <h2 id="ville-name"></h2>

            <p id="meteo-icone"></p>

            <p id="temperature"></p>

            <p id="meteo-description"></p>

            <div>
                <div>
                    <p>Humidité</p>
                    <p id="humidite"></p>
                </div>

                <div>
                    <p>Vitesse du vent</p>
                    <p id="vitesse-vent"></p>
                </div>
            </div>

        </section>

        <section id="liste-previsions"
            class="hidden flex flex-nowrap justify-start md:justify-center gap-4 w-full px-3 overflow-x-auto">

        </section>


    </main>
    <footer class="mt-auto bg-gradient-to-br from-sky-400 to-blue-600 p-5 text-white">
        <div class="text-center">
            <p class="font-bold text-lg">Weather App</p>
            <p class="text-sm text-white mt-2">
                Les informations météo en temps réel.
            </p>
            <p class="text-xs text-white mt-3">
                © 2026 Mohamed Lamssiah | YouCode. Tous droits réservés.
            </p>
        </div>


    </footer>

    <script type="module" src="js/scripts.js"></script>
</body>

</html>
